# config/macros.yaml
# Logical OSC macros expanded by osc_bridge.py.
# Hardware MIDI CC values are authoritative in tools/AIDJ/midi_router.lua.

macros:
  - name: bpm_coarse
    description: Tempo coarse (120..240 BPM)
    range: [120, 240]
    osc: /ai/bpm

  - name: swing
    description: Global swing amount
    range: [0.0, 1.0]
    osc: /ai/swing

  - name: master_volume
    description: Master output volume
    range: [0.0, 1.0]
    target:
      track: master
      param: volume

  - name: send_reverb
    description: Reverb wet amount on track 7
    range: [0.0, 1.0]
    target:
      track: "7"           # fx track
      fx_index: 0
      param_index: 0

  - name: send_delay
    description: Delay wet amount on track 7
    range: [0.0, 1.0]
    target:
      track: "7"
      fx_index: 1
      param_index: 0

  - name: filter_cutoff
    description: Master Digital Filter parameter 2
    range: [0.0, 1.0]
    target:
      track: master
      fx_index: 0
      param_index: 0

  - name: distortion
    description: Distortion amount on break bus
    range: [0.0, 1.0]
    target:
      track: "2"
      fx_index: 0
      param_index: 0

  - name: bitcrush
    description: Cabinet drive placeholder on track 7
    range: [0.0, 1.0]
    target:
      track: "7"
      fx_index: 2
      param_index: 0
