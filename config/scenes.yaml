# config/scenes.yaml
# Declares operator/OpenCode scene metadata. Lua runtime does not parse this file.
# slot index in Renoise corresponds to scene id sent via /ai/scene.
# duration_bars is the performance target; a 256-line pattern is 16 bars at LPB=4
# and may loop to reach a 32-bar target.

scenes:
  - id: 1
    name: intro_amen_loop
    bpm: 174
    description: Opening amen break loop, pads only,Introduced kick after 4 bars
    tracks: [2, 5, 1]
    duration_bars: 32

